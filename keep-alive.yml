name: Manter banco de dados ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco pra evitar pausa por inatividade
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://wxvaekrrxfafxlirigya.supabase.co/rest/v1/servicos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
