<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Painel Admin — Máfia Barbearia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<div class="admin-login" id="adminLogin">
  <div class="admin-login-card">
    <span class="logo-top">MÁFIA</span>
    <h1 class="admin-title">Painel administrativo</h1>
    <p class="admin-sub">Acesso restrito. Entre com seu e-mail e senha de administrador.</p>
    <form id="formLogin">
      <div class="form-group full">
        <label for="adminEmail">Usuário</label>
        <input type="text" id="adminEmail" required>
      </div>
      <div class="form-group full">
        <label for="adminSenha">Senha</label>
        <input type="password" id="adminSenha" required>
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div class="admin-painel" id="adminPainel" style="display:none;">
  <header class="admin-header">
    <span class="logo-top">MÁFIA <span class="admin-header-sub">/ Admin</span></span>
    <div class="admin-header-actions">
      <a href="index.html" class="btn-mini">Ver site</a>
      <button id="btnLogout" class="btn btn-outline">Sair</button>
    </div>
  </header>

  <main class="container admin-main">

    <div class="admin-stats" id="adminStats">
      <div class="stat-card">
        <span class="stat-num" id="statHoje">–</span>
        <span class="stat-label">Hoje</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statPendentes">–</span>
        <span class="stat-label">Pendentes</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statConfirmados">–</span>
        <span class="stat-label">Confirmados</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statMes">–</span>
        <span class="stat-label">Este mês</span>
      </div>
    </div>

    <div class="admin-toolbar">
      <h2>Agendamentos</h2>
      <div class="admin-filtros">
        <input type="text" id="buscaTexto" placeholder="Buscar por nome, telefone ou e-mail">
        <select id="filtroStatus">
          <option value="todos">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <input type="date" id="filtroData">
        <button id="btnHoje" class="btn btn-outline">Hoje</button>
        <button id="btnAtualizar" class="btn btn-outline">Atualizar</button>
      </div>
    </div>

    <div id="adminLista" class="admin-lista">
      <p class="plano-vazio">Carregando agendamentos...</p>
    </div>
  </main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
